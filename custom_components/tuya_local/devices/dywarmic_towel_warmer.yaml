name: Towel warmer
products:
  - id: okgl1pojjzj7h8hp
    manufacturer: Dywarmic
entities:
  - entity: climate
    icon: "mdi:radiator"
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: true
            value: heat
          - dps_val: false
            value: "off"
      - id: 2
        type: integer
        name: temperature
        optional: true
        unit: C
        range:
          min: 0
          max: 135
      - id: 3
        type: integer
        name: current_temperature
        unit: C
      - id: 4
        type: string
        name: preset_mode
        optional: true
        mapping:
          - dps_val: smart
            value: smart
          - dps_val: manual
            value: manual
  - entity: select
    name: Heat level
    category: config
    icon: "mdi:thermometer-lines"
    dps:
      - id: 5
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: level_1
            value: "1"
          - dps_val: level_2
            value: "2"
          - dps_val: level_3
            value: "3"
          - dps_val: level_4
            value: "4"
  - entity: switch
    name: Eco mode
    category: config
    icon: "mdi:leaf"
    dps:
      - id: 6
        type: boolean
        optional: true
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        optional: true
        name: lock
  - entity: switch
    name: Indicator light
    category: config
    icon: "mdi:led-on"
    dps:
      - id: 8
        type: boolean
        name: switch
  - entity: select
    name: Temperature unit
    category: config
    icon: "mdi:thermometer"
    dps:
      - id: 9
        type: string
        name: option
        mapping:
          - dps_val: c
            value: "C"
          - dps_val: f
            value: "F"
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 12
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        unit: s
  - entity: sensor
    name: Heater status
    category: diagnostic
    dps:
      - id: 14
        type: string
        name: sensor
